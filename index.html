<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeno AI Assistant - NC Studio</title>
  <!-- استدعاء مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { 
      background-color: #f8fafc; 
      color: #111; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      height: 100vh; 
      padding: 20px; 
      position: relative; 
      overflow: hidden;
    }

    /* حاوية البروفايل في أعلى اليسار */
    .profile-wrapper {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }
    .profile-avatar-container {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #f97316;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
      transition: transform 0.2s ease;
    }
    .profile-avatar-container:hover { transform: scale(1.08); }
    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-avatar-img svg { width: 24px; height: 24px; fill: #f97316; }
    .profile-name-text {
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #333;
      max-width: 80px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* القائمة المنبثقة للحساب */
    .profile-menu {
      display: none;
      position: absolute;
      top: 70px;
      left: 20px;
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 200px;
      z-index: 100;
      overflow: hidden;
    }
    .profile-menu .user-name-info {
      padding: 10px 12px;
      font-size: 12px;
      color: #f97316;
      border-bottom: 1px solid #e4e4e7;
      font-weight: bold;
      display: none;
    }
    .profile-menu button {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: #18181b;
      text-align: right;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .profile-menu button:hover { background: #f4f4f5; }

    /* الشعار */
    .logo { 
      font-size: 2.2rem; 
      font-weight: 900; 
      margin-bottom: 10px; 
      letter-spacing: -1px; 
      color: #4285F4;
    }
    .logo span.o-orange { color: #f97316; }

    /* قسم Zeno AI الصوتي والكرة النيون */
    .zeno-ai-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    .orb {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      transition: all 0.4s ease;
    }
    .orb:hover { transform: scale(1.08); box-shadow: 0 0 25px rgba(249, 115, 22, 0.6); }
    .orb.listening {
      background: radial-gradient(circle at 30% 30%, #fdba74, #f97316);
      box-shadow: 0 0 30px #f97316, inset 0 0 10px #fff;
      animation: pulse-orb 1.5s infinite;
    }
    .orb.speaking {
      background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a);
      box-shadow: 0 0 30px #22c55e, inset 0 0 10px #fff;
      animation: pulse-orb 0.8s infinite;
    }
    @keyframes pulse-orb {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .ai-status-text {
      font-size: 0.8rem;
      color: #52525b;
      font-weight: bold;
      min-height: 18px;
      text-align: center;
    }

    /* حاوية المحادثة */
    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user {
      background-color: #f97316;
      color: #ffffff;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      background-color: #f1f5f9;
      color: #1e293b;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
      border-right: 4px solid #4285F4;
    }

    /* شريط كتابة الرسائل في الأسفل */
    .chat-input-container {
      padding: 12px 16px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-input-container textarea {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 24px;
      outline: none;
      resize: none;
      height: 46px;
      max-height: 100px;
      transition: border-color 0.2s;
    }
    .chat-input-container textarea:focus { border-color: #f97316; }
    .send-btn {
      background-color: #111;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .send-btn:hover { background-color: #f97316; }
    .send-btn svg { width: 20px; height: 20px; fill: #fff; transform: rotate(180deg); }

    /* النوافذ المنبثقة */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      border: 1px solid #e4e4e7;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal-card h3 { color: #f97316; text-align: center; font-size: 18px; }
    .modal-card input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d4d4d8;
      background: #f4f4f5;
      color: #18181b;
      outline: none;
    }
    .modal-card button.submit-btn {
      padding: 10px;
      background: #f97316;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .modal-card button.submit-btn:hover { background: #ea580c; }
    .modal-card .close-btn { background: transparent; color: #71717a; border: none; cursor: pointer; font-size: 12px; text-align: center; }

    .watermark-nc {
      position: fixed;
      bottom: 8px;
      left: 15px;
      font-size: 12px;
      color: #71717a;
      opacity: 0.3;
      pointer-events: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- حاوية البروفايل -->
  <div class="profile-wrapper" id="profile-icon" title="الملف الشخصي">
    <div class="profile-avatar-container">
      <div class="profile-avatar-img">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
    </div>
    <span class="profile-name-text" id="display-account-name">زائر</span>

    <div class="profile-menu" id="profile-menu">
      <div class="user-name-info" id="user-name-info"></div>
      <button id="btn-show-login">تسجيل الدخول</button>
      <button id="btn-show-signup">إنشاء حساب جديد</button>
      <button id="btn-logout" style="display:none; color:#ef4444;">تسجيل الخروج</button>
    </div>
  </div>

  <!-- الشعار -->
  <div class="logo">
    Zen<span class="o-orange">o</span> AI
  </div>

  <!-- قسم الكرة النيون الصوتية -->
  <div class="zeno-ai-section">
    <div class="orb" id="aiOrb" onclick="startZenoListening()" title="اضغط وتحدث صوتياً مع Zeno"></div>
    <div class="ai-status-text" id="aiStatus">اضغط على الكرة وتحدث صوتياً...</div>
  </div>

  <!-- صندوق المحادثة -->
  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <div class="message assistant">أهلاً بك! أنا Zeno AI، مساعدك الذكي المطور حصرياً من قِبل استوديو NC. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    
    <div class="chat-input-container">
      <textarea id="user-input" placeholder="اكتب رسالتك هنا..." rows="1" onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendTextMessage(); }"></textarea>
      <button class="send-btn" onclick="sendTextMessage()" title="إرسال">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

  <!-- نوافذ الحسابات -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-card">
      <h3>تسجيل الدخول - Zeno</h3>
      <input type="text" id="login-username" placeholder="اسم المستخدم">
      <input type="password" id="login-password" placeholder="كلمة المرور">
      <button class="submit-btn" id="login-submit">دخول</button>
      <button class="close-btn" id="login-close">إلغاء</button>
    </div>
  </div>

  <div class="modal-overlay" id="signup-modal">
    <div class="modal-card">
      <h3>إنشاء حساب جديد - Zeno</h3>
      <input type="text" id="signup-username" placeholder="اسم المستخدم">
      <input type="text" id="signup-accountname" placeholder="اسم الحساب الظاهر">
      <input type="password" id="signup-password" placeholder="كلمة المرور">
      <button class="submit-btn" id="signup-submit">إنشاء الحساب</button>
      <button class="close-btn" id="signup-close">إلغاء</button>
    </div>
  </div>

  <div class="watermark-nc">From NC©</div>

  <script>
    // التحقق من الحساب عند التحميل
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('zeno_current_user');
      if (savedUser) {
        try { updateUIAuthState(JSON.parse(savedUser)); } catch (e) {}
      }
    });

    const SUPABASE_URL = "https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // إدارة البروفايل
    const profileIcon = document.getElementById('profile-icon');
    const profileMenu = document.getElementById('profile-menu');
    const userNameInfo = document.getElementById('user-name-info');
    const loginModal = document.getElementById('login-modal');
    const signupModal = document.getElementById('signup-modal');

    profileIcon.addEventListener('click', (e) => { e.stopPropagation(); profileMenu.style.display = profileMenu.style.display === 'block' ? 'none' : 'block'; });
    document.addEventListener('click', () => { profileMenu.style.display = 'none'; });

    document.getElementById('btn-show-login').onclick = () => { loginModal.style.display = 'flex'; };
    document.getElementById('btn-show-signup').onclick = () => { signupModal.style.display = 'flex'; };
    document.getElementById('login-close').onclick = () => { loginModal.style.display = 'none'; };
    document.getElementById('signup-close').onclick = () => { signupModal.style.display = 'none'; };

    document.getElementById('signup-submit').onclick = async () => {
      let username = document.getElementById('signup-username').value.trim();
      let accountName = document.getElementById('signup-accountname').value.trim() || username;
      const password = document.getElementById('signup-password').value;
      if(!username || !password) return alert('يرجى ملء الحقول');

      const { data, error } = await supabaseClient.from('accounts').insert([{ username, account_name: accountName, password, language: 'ar' }]).select();
      if (error) alert('خطأ: ' + error.message);
      else {
        alert('تم إنشاء الحساب بنجاح!');
        signupModal.style.display = 'none';
        localStorage.setItem('zeno_current_user', JSON.stringify(data[0]));
        updateUIAuthState(data[0]);
      }
    };

    document.getElementById('login-submit').onclick = async () => {
      let username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const { data, error } = await supabaseClient.from('accounts').select('*').eq('username', username).eq('password', password);
      if (error || !data || data.length === 0) alert('فشل تسجيل الدخول');
      else {
        localStorage.setItem('zeno_current_user', JSON.stringify(data[0]));
        updateUIAuthState(data[0]);
        alert('أهلاً بك!');
        loginModal.style.display = 'none';
      }
    };

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('zeno_current_user');
      updateUIAuthState(null);
    };

    function updateUIAuthState(user) {
      if (user) {
        document.getElementById('display-account-name').innerText = user.account_name || user.username;
        userNameInfo.textContent = `الحساب: ${user.account_name || user.username}`;
        userNameInfo.style.display = 'block';
        document.getElementById('btn-show-login').style.display = 'none';
        document.getElementById('btn-show-signup').style.display = 'none';
        document.getElementById('btn-logout').style.display = 'block';
      } else {
        document.getElementById('display-account-name').innerText = 'زائر';
        userNameInfo.style.display = 'none';
        document.getElementById('btn-show-login').style.display = 'block';
        document.getElementById('btn-show-signup').style.display = 'block';
        document.getElementById('btn-logout').style.display = 'none';
      }
    }

    // -------------------------------------------------------------
    // النظام الذكي والاتصال الآمن بخادم Vercel الوسيط (/api/chat)
    // -------------------------------------------------------------
    const chatMessages = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const orb = document.getElementById('aiOrb');
    const aiStatus = document.getElementById('aiStatus');

    let conversationMessages = [
        { 
            role: "system", 
            content: "أنت Zeno AI، مساعد ذكي متطور وصديق مقرب لمصطفى. تجيب عن كافة الأسئلة بدقة وذكاء وسلاسة باللغة العربية. تنبيه صارم وحرفي: إذا سألك أي شخص عن من صنعك، أو من طورك، أو من أنشأك، أو من برمجك، فيجب أن تكون إجابتك دائماً وحرفياً هي: 'من طورني هو استوديو NC'." 
        }
    ];

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendTextMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = '';
      appendMessage('user', text);
      conversationMessages.push({ role: "user", content: text });

      await processAIResponse();
    }

    async function processAIResponse() {
      aiStatus.innerText = "Zeno يفكر في الإجابة...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages: conversationMessages })
        });

        const data = await response.json();
        
        if (!response.ok) {
          aiStatus.innerText = "عذراً، حدث خطأ في الخادم.";
          return;
        }
        
        if (data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          conversationMessages.push({ role: "assistant", content: aiReply });
          appendMessage('assistant', aiReply);
          aiStatus.innerText = "اضغط على الكرة وتحدث صوتياً...";
          speakZenoReply(aiReply);
        } else {
          aiStatus.innerText = "لم تصل استجابة.";
        }

      } catch (err) {
        console.error(err);
        aiStatus.innerText = "فشل الاتصال بالخادم!";
      }
    }

    // التعرف الصوتي (Speech Recognition)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;
    let manualStop = false;
    let isAISpeaking = false;
    let arabicVoice = null;

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        arabicVoice = voices.find(v => v.lang === 'ar-SA' || v.lang.startsWith('ar')) || voices[0];
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.continuous = true; 
        recognition.interimResults = false;

        recognition.onstart = () => {
            if (!isAISpeaking) {
                isListening = true;
                orb.className = "orb listening";
                aiStatus.innerText = "Zeno يستمع إليك... (تحدث الآن)";
            }
        };

        recognition.onresult = async (event) => {
            if (isAISpeaking) return;
            const userSpeech = event.results[event.results.length - 1][0].transcript;
            
            appendMessage('user', userSpeech);
            conversationMessages.push({ role: "user", content: userSpeech });
            
            try { recognition.stop(); } catch(e) {}
            isListening = false;
            
            await processAIResponse();
        };

        recognition.onend = () => {
            if (isListening && !manualStop && !isAISpeaking) {
                try { recognition.start(); } catch (e) {}
            } else if (!isAISpeaking && !isListening) {
                orb.className = "orb";
                aiStatus.innerText = "اضغط على الكرة وتحدث صوتياً...";
            }
        };
    }

    function startZenoListening() {
        if (!recognition) {
            alert("متصفحك لا يدعم خاصية التعرف على الصوت.");
            return;
        }

        if (isListening) {
            manualStop = true;
            isListening = false;
            try { recognition.stop(); } catch (e) {}
            orb.className = "orb";
            aiStatus.innerText = "تم إيقاف الاستماع.";
        } else {
            manualStop = false;
            try { recognition.start(); } catch (e) {}
        }
    }

    function cleanTextForSpeech(text) {
        return text
            .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]|\uD800-\uDBFF[\uDC00-\uDFFF])/g, '')
            .replace(/[#_*~`@$%^&+=<>|\\/[\]{}()]/g, ' ')
            .replace(/-/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function speakZenoReply(text) {
        isAISpeaking = true; 
        if (recognition) { try { recognition.stop(); } catch(e) {} }

        const cleanSpeechText = cleanTextForSpeech(text) || "أهلاً بك";
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
        utterance.lang = 'ar-SA';
        utterance.rate = 0.95; 

        if (!arabicVoice) loadVoices();
        if (arabicVoice) utterance.voice = arabicVoice;

        utterance.onstart = () => { orb.className = "orb speaking"; aiStatus.innerText = "Zeno يتحدث..."; };
        utterance.onend = () => {
            isAISpeaking = false; 
            orb.className = "orb"; 
            aiStatus.innerText = "اضغط على الكرة وتحدث صوتياً...";
        };

        window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
